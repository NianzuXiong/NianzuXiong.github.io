# Homepage content. Text fields accept Markdown.
en:
  name: "Dr. Nianzu Xiong"
  roles: "Economist, Educator, Public Speaker, and Entrepreneur"
  intro: "I hold a DPhil (PhD) in Economics from the University of Oxford. I work on cryptocurrency finance, the economics of AI, and the Chinese economy, and I speak at forums connecting the UK and China."
  cta_email: "Email me"
  cta_engagement: "See public engagement"
  interests_title: "Research interests"
  interests:
    - title: "Cryptocurrency Finance"
      body: "The optimality of token financing, token pricing in ICOs, and the regulation of real-world assets (RWAs) and stablecoins. In a chapter of my PhD thesis, I developed the first unified economic theory that explains three phenomena in Initial Coin Offerings (ICOs): underpricing, airdropping, and token retention."
    - title: "The Economics of AI"
      body: "New economic phenomena and mechanisms emerging in the age of AI. See my recent speech at the Oxford China Forum, [*How Does AI Think?*](/speeches/how-does-ai-think/)"
    - title: "The Chinese Economy"
      body: "Capital markets and Chinese firms going overseas."
    - title: "Game Theory"
      body: "Strategic competition in industrial organization, corporate finance, and political economy."
  education_title: "Education & honours"
  education:
    - degree: "DPhil (PhD) in Economics"
      school: "University of Oxford"
      year: "2026"
      note: "Godfrey Tyler Scholarship (full doctoral scholarship)"
    - degree: "MPhil in Economics"
      school: "University of Cambridge"
      year: "2023"
      note: ""
    - degree: "B.A. (Hons) Mathematics & B.A. (Hons) Economics"
      school: "University of Pennsylvania"
      year: "2022"
      note: "*Summa cum laude*; *Phi Beta Kappa* (one of six juniors inducted); Bernard Shanbaum Prize for Excellence in Economics (top 1 graduating economics major)"
  teaching_title: "Teaching"
  teaching: "I have worked as a Stipendiary Lecturer at Oxford. I have taught *Firms and Markets* to MBA students at Saïd Business School, *Economics* to MSc in Financial Economics students, and *Finance* and *Microeconomics* to undergraduates in PPE and Economics & Management. I have also served as an admissions interviewer for Oxford's PPE and E&M programmes."
  beyond_title: "Beyond academia"
  beyond: "I regularly host and speak at forums and summits connecting the UK and China, from a one-to-one dialogue with Sir Vince Cable that appeared on *China Daily* to hosting a forum for a Hunan TV reality show that has been watched over 130 million times."
  beyond_link: "See all public engagement"
  contact_lead: "For consulting services and collaborations, please contact me at"

zh:
  name: "熊念祖博士"
  roles: "经济学家、教育者、演讲者、创业者"
  intro: "您好！我是熊念祖，牛津大学经济学博士。我的研究关注加密货币金融、人工智能经济学与中国经济，也经常在连接中英两国的论坛上主持和演讲。"
  cta_email: "发送邮件"
  cta_engagement: "查看社会活动"
  interests_title: "研究兴趣"
  interests:
    - title: "加密货币金融"
      body: "代币融资的最优性、ICO 中的代币定价，以及现实世界资产（RWA）和稳定币的监管。在博士论文的一章中，我提出了首个能够统一解释首次代币发行（ICO）中三种现象的经济学理论：发行折价、空投和代币保留。"
    - title: "人工智能经济学"
      body: "AI 时代出现的新经济现象与新机制。参见我近期在牛津中国论坛的演讲[《AI 如何思考？》](/zh/speeches/how-does-ai-think/)。"
    - title: "中国经济"
      body: "资本市场与中国企业出海。"
    - title: "博弈论"
      body: "产业组织、公司金融和政治经济学中的战略竞争。"
  education_title: "教育背景与荣誉"
  education:
    - degree: "经济学博士（DPhil (PhD)）"
      school: "牛津大学"
      year: "2026"
      note: "Godfrey Tyler 全额博士奖学金"
    - degree: "经济学哲学硕士（MPhil）"
      school: "剑桥大学"
      year: "2023"
      note: ""
    - degree: "数学、经济学双学士（荣誉学位）"
      school: "宾夕法尼亚大学"
      year: "2022"
      note: "最高荣誉毕业（*summa cum laude*）；入选 *Phi Beta Kappa*（当年仅六名大三学生入选）；获 Bernard Shanbaum 经济学卓越奖（经济学专业第一名）"
  teaching_title: "教学"
  teaching: "我曾在牛津大学担任经济学讲师（Stipendiary Lecturer）。我在牛津大学赛德商学院为 MBA 学生讲授《企业与市场》（*Firms and Markets*），为金融经济学硕士（MSc in Financial Economics）学生讲授《经济学》（*Economics*），并为哲学、政治与经济学（PPE）及经济与管理（E&M）专业本科生讲授《金融学》（*Finance*）和《微观经济学》（*Microeconomics*）。我还曾担任牛津大学 PPE 和 E&M 专业的本科招生面试官。"
  beyond_title: "学术之外"
  beyond: "我经常主持和参与连接中英两国的论坛与峰会，包括与英国前商务大臣文斯·凯布尔爵士（Sir Vince Cable）进行一对一对话（获《中国日报》报道），以及为湖南卫视真人秀节目主持论坛，该节目播放量已超过 1.3 亿次。"
  beyond_link: "查看全部社会活动"
  contact_lead: "如需咨询服务或合作，欢迎联系："
