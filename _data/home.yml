  intro: "您好！我是熊念祖，牛津大学经济学博士。我的研究关注加密货币金融、人工智能经济学与中国经济，也经常在连接中英两国的论坛上主持和演讲。"
  cta_email: "发送邮件"
  cta_engagement: "查看社会活动"
  interests_title: "研究兴趣"
  interests:
    - title: "加密货币金融"
      body: "代币融资的最优性、ICO 中的代币定价，以及现实世界资产（RWA）和稳定币的监管。在博士论文的一章中，我提出了首个能够统一解释首次代币发行（ICO）中三种现象的经济学理论：发行折价、空投和代币保留。另见我关于代币平台最优融资的[研究论文](#papers)。"
    - title: "人工智能经济学"
      body: "AI 时代出现的新经济现象与新机制。参见我关于 AI 算力竞赛和 AI 时代教育的[研究论文](#papers)，以及我近期在牛津中国论坛的演讲[《AI 如何思考？》](/zh/speeches/how-does-ai-think/)。"
    - title: "中国经济"
      body: "资本市场与中国企业出海。"
    - title: "博弈论"
      body: "产业组织、公司金融和政治经济学中的战略竞争。"
  papers_title: "研究论文"
  papers:
    - title: "代币平台的最优融资：信息不对称与作为用户的投资者"
      original: "Optimal Platform Financing with Tokens: Asymmetric Information and Investors as Users"
      meta: "工作论文，2026 年 9 月（英文）"
      pdf: "/papers/Xiong_Token_Financing.pdf"
      pdf_label: "下载 PDF"
      abstract_label: "摘要"
      abstract: "本文研究：当创业者掌握平台前景的私人信息、而代币购买者会成为平台用户时，平台应当如何融资。平台可以发行债务、外部股权和代币。我们首先证明，在任何投资者信念下，一份合约只通过两个数影响创业者的收益：平台失败时投资者能得到多少（这决定了合约中有多少部分被错误定价），以及有多少投资者成为用户。债务在第一个维度上最好，代币在第二个维度上最好，而外部股权在两个维度上都被占优。因此，在混同信念下，高类型先发行安全债务，再出售代币，只有在代币额度用尽后才发行风险债务；除非代币出售已足以覆盖投资，空投总是劣于出售。随后我们研究信号博弈。在基准模型的每一个分离均衡中，低类型出售的代币都多于高类型，因此更大规模的代币出售是坏消息。经过均衡精炼，小项目对应最低成本分离均衡，大项目对应混同均衡，两者之间为半分离均衡。我们进一步证明，当服务用户的成本较高、且好平台更能留住用户时，代币出售会变成好消息。最后，发行成本使代币出售停留在内部水平；而当代币具有留存用户的作用时，代币融资可以排在债务之前。"
    - title: "芯片商、云服务商与前沿 AI 实验室：循环投资与算力竞赛的经济学"
      original: "Chipmakers, Cloud Providers, and Frontier AI Labs: Circular Investment and the Economics of the Compute Race"
      meta: "工作论文，2026 年 10 月（英文）"
      pdf: "/papers/Xiong_Compute_Race.pdf"
      pdf_label: "下载 PDF"
      abstract_label: "摘要"
      abstract: "本文把争夺 AI 前沿的竞赛建模为一个全支付竞赛：两家实验室向一家供应商购买算力，供应商从实验室的每一美元支出中赚取利润率，而奖金通过知识溢出随双方的算力支出增长。所有权把产业链各层连接起来：供应商持有实验室的股份，每家实验室的主要投资者持有供应商的股份，也可能持有竞争对手实验室的股份。我们得到对称均衡的闭式解，并证明：循环持股提高算力投入，当且仅当实验室对供应商的持股（以利润率加权）超过其对竞争对手的持股（以一减溢出率加权）。供应商对实验室的持股本身是中性的，但会放大实验室对供应商持股的效果。与跨行业研发竞赛不同，实验室的主要投资者可以从算力繁荣中获益，因为供应商的利润率不会被竞争耗散。不可能定理在所有权网络层面重新出现：若溢出率加上网络内利润率小于一，任何循环安排都无法既提高算力投入、又使参与者受益。我们还证明，排他性交易会抑制竞争对手实验室，并恰好在包容性交易毁损价值时创造价值；毁损价值的算力繁荣的损失由实验室的外部投资者承担；循环结构使算力投入对利润率压缩更加敏感。最后，我们加入了一层同样在竞赛的数据中心和电力开发商。"
    - title: "人工智能时代教育的未来"
      original: "On the Future of Education in the Age of AI"
      meta: "工作论文，2026 年 10 月（英文）"
      pdf: "/papers/Xiong_Education_AI.pdf"
      pdf_label: "下载 PDF"
      abstract_label: "摘要"
      abstract: "本文研究：当生成式 AI 能够完成历史上外部人才进入精英机构的主要途径——技术性工作——之后，精英机构如何选人。技术能力谁都可以检验，与候选人的出身无关；而 AI 时代真正重要的是判断力，它更难观察，关于它的信息又来自并非中立的推荐人。我们首先证明，来自其他机构的推荐信在任何均衡中都不传递信息，因为这些推荐人无论学生水平如何都希望学生被录用；而机构内部的推荐人与机构共享声誉，能够可信地传递信息，但带有偏向。随后我们证明，随着 AI 降低可检验技能的价值，即使评审公正，外部候选人也会被少选；任何既定的偏袒都变得更重要；过去培养并让人看见优秀外部人才的学徒制逐渐消失；争取靠山变得更容易。如果 AI 被用来检验想法，就能起到相反的作用：由外部候选人所在机构事先承诺的简单“通过 / 不通过”测试，比完全公开信息更能帮助他们被录用。最后，由于声誉由机构成员共同分享，这些力量会缓慢侵蚀机构的质量，并为通过可验证渠道评估外部人才的新机构进入创造机会。"
