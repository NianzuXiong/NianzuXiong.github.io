      year: "2022"
      note: "*Summa cum laude*; *Phi Beta Kappa* (one of six juniors inducted); Bernard Shanbaum Prize for Excellence in Economics (top 1 graduating economics major)"
  teaching_title: "Teaching"
  teaching: "I have worked as a Stipendiary Lecturer at Oxford. I have taught *Firms and Markets* to MBA students at Saïd Business School, *Economics* to MSc in Financial Economics students, and *Finance* and *Microeconomics* to undergraduates in PPE and Economics & Management. I have also served as an admissions interviewer for Oxford's PPE and E&M programmes."
  beyond_title: "Beyond academia"
  beyond: "I regularly host and speak at forums and summits connecting the UK and China, from a one-to-one dialogue with Sir Vince Cable that appeared on *China Daily* to hosting a forum for a Hunan TV reality show that has been watched over 130 million times."
  beyond_link: "See all public engagement"
  contact_lead: "For consulting services and collaborations, please contact me at"

zh:
  name: "熊念祖博士"
  roles: "经济学家、教育者、演讲者、创业者"
  intro: "您好！我是熊念祖，牛津大学经济学博士。我的研究关注加密货币金融、人工智能经济学与中国经济，也经常在连接中英两国的论坛上主持和演讲。"
  cta_email: "发送邮件"
  cta_engagement: "查看社会活动"
  interests_title: "研究兴趣"
  interests:
    - title: "加密货币金融"
      body: "代币融资的最优性、ICO 中的代币定价，以及现实世界资产（RWA）和稳定币的监管。在博士论文的一章中，我提出了首个能够统一解释首次代币发行（ICO）中三种现象的经济学理论：发行折价、空投和代币保留。另见我关于代币平台最优融资的[工作论文](#papers)。"
    - title: "人工智能经济学"
      body: "AI 时代出现的新经济现象与新机制。参见我关于 AI 算力竞赛和精英教育的[工作论文](#papers)，以及我近期在牛津中国论坛的演讲[《AI 如何思考？》](/zh/speeches/how-does-ai-think/)。"
    - title: "中国经济"
      body: "资本市场与中国企业出海。"
    - title: "博弈论"
      body: "产业组织、公司金融和政治经济学中的战略竞争。"
  papers_title: "工作论文"
  papers:
    - title: "代币平台的最优融资：信息不对称与作为用户的投资者"
      original: "Optimal Platform Financing with Tokens: Asymmetric Information and Investors as Users"
      meta: "工作论文，2026 年 9 月（英文）"
      pdf: "/papers/Xiong_Token_Financing.pdf"
      pdf_label: "下载 PDF"
      abstract_label: "摘要"
      abstract: "平台可以通过债务、外部股权或代币融资，而代币的购买者会成为平台的用户。本文研究创业者掌握平台前景的私人信息时如何选择融资方式。在任何投资者信念下，一份合约只通过两个数影响创业者的收益：平台失败时投资者能得到多少（这决定了合约中有多少部分被错误定价），以及有多少投资者成为用户。债务在第一个维度上最好，代币在第二个维度上最好；外部股权在两个维度上都被占优。因此，在混同信念下，高类型先发行安全债务，再出售代币，只有在代币额度用尽后才发行风险债务。除非代币出售已足以覆盖投资，空投总是劣于出售。在基准模型的每一个分离均衡中，低类型出售的代币都多于高类型，因此更大规模的代币出售是坏消息。经过均衡精炼，小项目对应最低成本分离均衡，大项目对应混同均衡，两者之间为半分离均衡。当服务用户的成本较高、且好平台更能留住用户时，代币出售会变成好消息。发行成本使代币出售停留在内部水平；而当代币具有留存用户的作用时，代币融资可以排在债务之前。"
    - title: "芯片商、云服务商与前沿 AI 实验室：循环投资与算力竞赛的经济学"
      original: "Chipmakers, Cloud Providers, and Frontier AI Labs: Circular Investment and the Economics of the Compute Race"
      meta: "工作论文，2026 年 10 月（英文）"
      pdf: "/papers/Xiong_Compute_Race.pdf"
      pdf_label: "下载 PDF"
      abstract_label: "摘要"
      abstract: "芯片制造商和云服务商入股购买其算力的前沿 AI 实验室，实验室则反过来获得供应商的股权或认股权证。本文在一个 AI 产业链模型中刻画这种循环投资：各实验室在存在知识溢出 α 的全支付竞赛中争夺前沿，并向赚取利润率的供应商购买算力。我得到了闭式均衡解。供应商持有实验室的股份对算力投入是中性的；实验室持有供应商的股份相当于一种按量返利，而供应商的持股会放大这一效应。所有权网络的价值随算力投入以 α + μ<sub>N</sub> − 1 的速率变化，其中 μ<sub>N</sub> 是每一美元算力支出中作为利润留存在网络内部的份额。低于这一阈值时，存在一个不可能定理：任何循环安排都无法既提高算力投入、又使参与者受益。即便如此，内部人仍可能以牺牲实验室外部投资者的利益为代价获益。排他性交易会抑制竞争对手实验室，并恰好在包容性交易毁损价值时创造价值。循环结构会放大对利润率压缩的风险敞口。加入数据中心和电力层后，各阈值会出现跨层反馈项，而将电力纳入网络可以逆转所处的区间。"
    - title: "人工智能时代精英教育的未来"
      original: "On the Future of Elite Education in the Age of AI"
      meta: "工作论文，2026 年 10 月（英文）"
      pdf: "/papers/Xiong_Elite_Education_AI.pdf"
      pdf_label: "下载 PDF"
      abstract_label: "摘要"
      abstract: "对外部候选人来说，进入顶尖大学、研究机构和专业服务公司的主要途径一直是技术能力：这类工作谁都能检验，与出身无关。如今，生成式 AI 已经能完成其中很大一部分。本文研究的是：当最重要的能力变成更难观察的判断力时，机构如何选人。来自其他机构的推荐人的意见没有分量，因为无论学生水平如何，他们都希望学生被录用。机构内部的推荐人与机构共享声誉，因此他们的意见会被采信，但他们会偏向自己的候选人。随着 AI 降低可检验技能的价值，会出现四个后果：即使评审公正，外部候选人也会被少选；偏袒的作用变大；过去培养并让人看见优秀外部人才的学徒制逐渐消失；争取靠山变得更容易。如果 AI 被用来检验想法，就能起到相反的作用：由外部候选人所在机构事先承诺的简单“通过 / 不通过”测试，比完全公开信息更能帮助他们。"
