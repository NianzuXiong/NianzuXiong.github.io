  teaching: "我曾在牛津大学担任经济学讲师（Stipendiary Lecturer）。我在牛津大学赛德商学院为 MBA 学生讲授《企业与市场》（*Firms and Markets*），为金融经济学硕士（MSc in Financial Economics）学生讲授《经济学》（*Economics*），并为哲学、政治与经济学（PPE）及经济与管理（E&M）专业本科生讲授《金融学》（*Finance*）和《微观经济学》（*Microeconomics*）。我还曾担任牛津大学 PPE 和 E&M 专业的本科招生面试官。"
