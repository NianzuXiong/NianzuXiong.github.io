  interests_title: "Research interests"
  interests:
    - title: "Cryptocurrency Finance"
      body: "The optimality of token financing, token pricing in ICOs, and the regulation of real-world assets (RWAs) and stablecoins. In a chapter of my PhD thesis, I developed the first unified economic theory that explains three phenomena in Initial Coin Offerings (ICOs): underpricing, airdropping, and token retention. See also my [research paper](#papers) on optimal platform financing with tokens."
    - title: "The Economics of AI"
      body: "New economic phenomena and mechanisms emerging in the age of AI. See my [research papers](#papers) on the AI compute race and on education in the age of AI, and my recent speech at the Oxford China Forum, [*How Does AI Think?*](/speeches/how-does-ai-think/)"
