en:
  name: "Dr. Nianzu Xiong"
  roles: "Economist, Educator, Public Speaker, and Entrepreneur"
  intro: "I hold a PhD in Economics from the University of Oxford. I work on Cryptocurrency Finance, the Economics of AI, and the Chinese Economy, and I speak at forums connecting the UK and China."
  cta_email: "Email me"
  cta_engagement: "See public engagement"
  interests_title: "Research interests"
  interests:
    - title: "Cryptocurrency Finance"
      body: "The optimality of token financing, token pricing in ICOs, and the regulation of real-world assets (RWAs) and stablecoins. In a chapter of my PhD thesis, I developed the first unified economic theory that explains three phenomena in Initial Coin Offerings (ICOs): underpricing, airdropping, and token retention. See also my [working paper](#papers) on optimal platform financing with tokens."
    - title: "The Economics of AI"
      body: "New economic phenomena and mechanisms emerging in the age of AI. See my [working papers](#papers) on the AI compute race and on elite education, and my recent speech at the Oxford China Forum, [*How Does AI Think?*](/speeches/how-does-ai-think/)"
    - title: "The Chinese Economy"
      body: "Capital markets and Chinese firms going overseas."
    - title: "Game Theory"
      body: "Strategic competition in industrial organization, corporate finance, and political economy."
  papers_title: "Working papers"
  papers:
    - title: "Optimal Platform Financing with Tokens: Asymmetric Information and Investors as Users"
      original: ""
      meta: "Working paper, September 2026"
      pdf: "/papers/Xiong_Token_Financing.pdf"
      pdf_label: "Download PDF"
      abstract_label: "Abstract"
      abstract: "A platform can raise capital with debt, outside equity, or tokens, and the buyers of tokens become its users. I study this choice when the entrepreneur privately knows the platform's prospects. Under any investor belief, a contract affects the entrepreneur only through two numbers: what investors receive if the platform fails, which determines how much of the contract is mispriced, and how many investors become users. Debt is best on the first margin and tokens on the second; outside equity is dominated on both. Under pooled beliefs the high type therefore issues safe debt first, then tokens, and risky debt only once token capacity is exhausted. Airdrops are dominated by sales unless sales already cover the investment. In the baseline, the low type sells more tokens than the high type in every separating equilibrium, so a larger token sale is bad news. Refinement selects least-cost separation for small projects, pooling for large projects, and semi-separation in between. Token sales become good news when users are costly to serve and good platforms retain users better. Issuance costs cap token sales at an interior level, and a retention role for tokens can put them ahead of debt."
    - title: "Chipmakers, Cloud Providers, and Frontier AI Labs: Circular Investment and the Economics of the Compute Race"
      original: ""
      meta: "Working paper, October 2026"
      pdf: "/papers/Xiong_Compute_Race.pdf"
      pdf_label: "Download PDF"
      abstract_label: "Abstract"
      abstract: "Chipmakers and cloud providers take equity stakes in the frontier AI labs that buy their compute, and labs receive equity or warrants in their suppliers in return. I model this circular investment in an AI stack where labs race for the frontier in an all-pay contest with knowledge spillovers α and buy compute from suppliers that earn a margin. I obtain closed-form equilibria. A supplier's stake in a lab is neutral for compute; the lab's stake in its supplier acts as a volume rebate, which the supplier's stake amplifies. The value of the ownership network moves with compute at rate α + μ<sub>N</sub> − 1, where μ<sub>N</sub> is the share of each compute dollar retained as profit inside the network. Below this threshold, an impossibility theorem holds: no circular arrangement raises compute and benefits its participants. Even then, insiders can gain at the expense of the labs' outside investors. Exclusive deals discourage rival labs and create value exactly when inclusive deals destroy it. Circularity amplifies exposure to margin compression. With data-center and power layers, the thresholds acquire cross-layer feedback terms, and bringing power into the network can reverse the regime."
    - title: "On the Future of Elite Education in the Age of AI"
      original: ""
      meta: "Working paper, October 2026"
      pdf: "/papers/Xiong_Elite_Education_AI.pdf"
      pdf_label: "Download PDF"
      abstract_label: "Abstract"
      abstract: "For outsiders, the main route into elite universities, research labs and professional firms has been technical skill: work that anyone can check, whatever the candidate's background. Generative AI now does much of this work. We model how institutions choose people once the skill that matters most is judgment, which is harder to observe. Letters from referees at other institutions carry no weight, because those referees want their students placed regardless of quality. Sponsors inside the institution share in its reputation, so they are believed, but they favor their own candidates. As AI makes checkable skills less valuable, four things follow: outsiders are under-selected even by fair evaluators, favoritism matters more, the apprenticeships that once trained and revealed talented outsiders disappear, and winning a patron gets easier. AI can push the other way if it is used to verify ideas. A simple pass–fail test that the outsider's home institution commits to in advance helps outsiders more than full disclosure would."
  education_title: "Education & honours"
  education:
    - degree: "PhD in Economics"
      school: "University of Oxford"
      year: "2026"
      note: "Godfrey Tyler Scholarship (full doctoral scholarship)"
    - degree: "MPhil in Economic Research"
